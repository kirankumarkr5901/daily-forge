# Render blueprint for the DailyForge API.
#
# Render reads this on "New > Blueprint" and creates the service from it, so the
# deployment is described in the repo rather than in somebody's memory of which
# checkboxes they ticked. Changing this file and pushing changes the deployment.
#
# The database is deliberately NOT defined here: it lives on Neon (free tier, and it
# survives this service being deleted and recreated). Its connection details arrive
# through the environment variables below.

services:
  - type: web
    name: dailyforge-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Closest region to IST. Neon should be created in Singapore too — a database on
    # the other side of the world adds a round trip to every single query.
    region: singapore
    healthCheckPath: /actuator/health
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Neon: Dashboard > Connection Details. Use the POOLED host (it contains "-pooler")
      # — the free tier's direct connections are few, and Hikari will exhaust them.
      # Format: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # Free instances are small; more pool than this and the JVM and the pool fight
      # over the same 512MB.
      - key: DB_POOL_SIZE
        value: 3

      # Signing key for this app's own JWTs. Generated by Render, never seen by anyone,
      # and never the same as any other environment's.
      - key: DAILYFORGE_AUTH_JWT_SECRET
        generateValue: true

      # The exact frontend origin. No wildcard, ever (DEPLOYMENT.md phase 2.4).
      # Set to the Netlify site URL once it exists.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Leave unset to hide the Google button entirely; set it to switch sign-in on.
      - key: GOOGLE_CLIENT_ID
        sync: false
