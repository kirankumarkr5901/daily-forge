spring:
  application:
    name: dailyforge

  # Schema is owned by Flyway. Hibernate may only check that the entities match it.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.dailyforge: INFO

dailyforge:
  # Comma-separated origins allowed to call the API. Never a wildcard in production.
  cors:
    allowed-origins: http://localhost:4200

  auth:
    # Development-only key. Deployed environments MUST override it from the environment
    # (DAILYFORGE_AUTH_JWT_SECRET); the app refuses to start on anything shorter than
    # 32 bytes, because a short HMAC key is a forgeable one.
    jwt-secret: ${DAILYFORGE_AUTH_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    bcrypt-strength: 12
    # Blank disables Google sign-in entirely: the button is hidden rather than broken.
    # Set GOOGLE_CLIENT_ID to switch it on. No code change is needed.
    google-client-id: ${GOOGLE_CLIENT_ID:}

---
# Local development. File-mode H2 so a seven-day streak survives a restart (spec §3.2).
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # DB_CLOSE_DELAY=-1: without it, H2 closes the database file entirely the moment
    # the connection pool's last idle connection is evicted (Hikari does this
    # routinely), and the next request to need a connection crashes with "The database
    # has been closed" rather than silently reopening it. -1 keeps the database open
    # for the life of the JVM regardless of how many connections are open at once.
    url: jdbc:h2:file:./.data/dailyforge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.dailyforge: DEBUG

---
# Tests. In-memory, thrown away per run.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:dailyforge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver

dailyforge:
  auth:
    jwt-secret: test-only-secret-0123456789abcdefghijklmnop
    bcrypt-strength: 4

---
# Staging and production. Everything comes from the environment; nothing is committed.
spring:
  config:
    activate:
      on-profile: staging | prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

dailyforge:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    jwt-secret: ${DAILYFORGE_AUTH_JWT_SECRET}
    google-client-id: ${GOOGLE_CLIENT_ID:}
