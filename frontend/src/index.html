<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DailyForge</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Everything you log becomes points." />
    <meta name="author" content="Kirankumar K R" />
    <!-- Copyright (c) 2026 Kirankumar K R. MIT licensed — see LICENSE in the repository. -->
    <link rel="license" href="https://github.com/kirankumarkr5901/daily-forge/blob/main/LICENSE" />

    <!-- Matches the app surface in each theme so the browser chrome does not flash a
         colour the design system never chose. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f3f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1216" />

    <!-- SVG first for anything modern, .ico as the fallback (it embeds 16/32/48). -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Sets data-theme before first paint, matching ThemeService's own default (DARK)
         and stored choice exactly — waiting for Angular to bootstrap would flash the
         light palette on every load. SYSTEM leaves no attribute, the same as
         ThemeService.apply(), so the prefers-color-scheme rules below decide instead. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dailyforge.theme');
          var choice = stored === 'LIGHT' || stored === 'DARK' || stored === 'SYSTEM' ? stored : 'DARK';
          if (choice !== 'SYSTEM') {
            document.documentElement.setAttribute('data-theme', choice.toLowerCase());
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
