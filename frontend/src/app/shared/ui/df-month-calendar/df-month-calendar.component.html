<div class="month-calendar" [class.month-calendar--done-tone]="tone() === 'done'">
  <button
    type="button"
    class="month-calendar__disclosure"
    [attr.aria-expanded]="expanded()"
    (click)="toggle()"
  >
    <span class="month-calendar__heading">{{ heading() }}</span>
    <span class="month-calendar__summary">
      @if (loggedDayCount() > 0) {
        {{ loggedDayCount() }} {{ loggedDayCount() === 1 ? 'day' : 'days' }} in {{ viewedMonth().label }}
      } @else {
        Nothing in {{ viewedMonth().label }}
      }
    </span>
    <lucide-icon
      class="month-calendar__chevron"
      [class.month-calendar__chevron--open]="expanded()"
      [img]="expandIcon"
      [size]="18"
      aria-hidden="true"
    />
  </button>

  @if (expanded()) {
    <div class="month-calendar__body" role="group" [attr.aria-label]="heading()">
      <div class="month-calendar__nav">
        <button
          type="button"
          class="month-calendar__nav-arrow"
          [disabled]="!canGoOlder()"
          aria-label="Previous month"
          (click)="olderMonth()"
        >
          <lucide-icon [img]="prevIcon" [size]="18" aria-hidden="true" />
        </button>
        <h3 class="month-calendar__title">{{ viewedMonth().label }}</h3>
        <button
          type="button"
          class="month-calendar__nav-arrow"
          [disabled]="!canGoNewer()"
          aria-label="Next month"
          (click)="newerMonth()"
        >
          <lucide-icon [img]="nextIcon" [size]="18" aria-hidden="true" />
        </button>
      </div>

      <div class="month-calendar__weekdays" aria-hidden="true">
        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
      </div>
      @for (week of viewedMonth().weeks; track $index) {
        <div class="month-calendar__week">
          @for (date of week; track date ?? $index) {
            @if (date) {
              <button
                type="button"
                class="month-calendar__cell"
                [attr.data-heat]="heatStep(date)"
                [attr.aria-label]="ariaLabel(date)"
                [disabled]="!hasValue(date)"
                (click)="select(date)"
              >
                {{ dayNumber(date) }}
              </button>
            } @else {
              <span class="month-calendar__cell month-calendar__cell--pad" aria-hidden="true"></span>
            }
          }
        </div>
      }
    </div>
  }
</div>
