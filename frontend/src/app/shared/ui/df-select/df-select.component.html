<label class="df-select__label" [attr.for]="fieldId">{{ label() }}</label>

<div class="df-select__field" [class.df-select__field--invalid]="!!error()">
  <select
    class="df-select__control"
    [id]="fieldId"
    [value]="value()"
    [disabled]="disabled()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="error() ? fieldId + '-error' : hint() ? fieldId + '-hint' : null"
    (change)="handleChange($event)"
  >
    @for (option of options(); track option.value) {
      <option [value]="option.value" [disabled]="option.disabled ?? false">
        {{ option.label }}
      </option>
    }
  </select>

  <lucide-icon class="df-select__chevron" [img]="chevron" [size]="18" aria-hidden="true" />
</div>

@if (error(); as message) {
  <p class="df-select__error" [id]="fieldId + '-error'">{{ message }}</p>
} @else if (hint(); as message) {
  <p class="df-select__hint" [id]="fieldId + '-hint'">{{ message }}</p>
}
