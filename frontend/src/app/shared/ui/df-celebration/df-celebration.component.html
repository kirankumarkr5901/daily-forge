@if (active()) {
  <div class="celebration" role="status" aria-live="polite">
    <div class="celebration__particles" aria-hidden="true">
      @for (particle of particles(); track particle.id) {
        <span
          class="celebration__particle"
          [attr.data-heat]="particle.heatStep"
          [style.left]="particle.left"
          [style.animation-delay]="particle.delay"
          [style.animation-duration]="particle.duration"
          [style.--drift]="particle.drift"
          [style.--rotate]="particle.rotate"
        ></span>
      }
    </div>
    <p class="celebration__badge">{{ label() }}</p>
  </div>
}
