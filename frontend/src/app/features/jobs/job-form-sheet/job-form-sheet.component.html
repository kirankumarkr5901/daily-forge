<df-sheet [open]="open()" (openChange)="$event ? null : close()" heading="New application">
  <div class="job-form">
    <df-input label="Company" [ngModel]="company()" (ngModelChange)="company.set($event)" />
    <df-input label="Role" [ngModel]="role()" (ngModelChange)="role.set($event)" />
    <df-input label="City (optional)" [ngModel]="city()" (ngModelChange)="city.set($event)" />
    <df-select label="Source" [options]="sourceOptions" [ngModel]="source()" (ngModelChange)="source.set($event)" />

    @if (source() !== 'APPLIED') {
      <df-input label="Referrer name (optional)" [ngModel]="referrerName()" (ngModelChange)="referrerName.set($event)" />
    }

    <df-input
      label="Application link (optional)"
      type="url"
      placeholder="https://"
      [ngModel]="jobUrl()"
      (ngModelChange)="jobUrl.set($event)"
    />

    <!-- The referral clock: what you were given to quote, and when you asked. Only a
         referral source has either, and the ask date is what the referral board counts
         from — so it is offered here rather than assumed to be the day you logged it. -->
    @if (isReferral()) {
      <df-input
        label="Referral ID (optional)"
        placeholder="e.g. REF-8821"
        [ngModel]="referralId()"
        (ngModelChange)="referralId.set($event)"
      />
      <df-input
        label="Referral asked on"
        type="date"
        [ngModel]="referralRequestedOn() || date()"
        (ngModelChange)="referralRequestedOn.set($event)"
      />
    }

    <df-input label="Note (optional)" [ngModel]="note()" (ngModelChange)="note.set($event)" />

    @if (error(); as message) {
      <p class="job-form__error" role="alert">{{ message }}</p>
    }

    <button
      dfButton
      type="button"
      variant="primary"
      size="lg"
      [fullWidth]="true"
      [loading]="saving()"
      [disabled]="saving() || !company().trim() || !role().trim()"
      (click)="save()"
    >
      Add application
    </button>
  </div>
</df-sheet>
