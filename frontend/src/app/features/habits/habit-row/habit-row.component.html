<div
  class="df-habit-row__surface"
  [class.df-habit-row__surface--done]="checked()"
  [class.df-habit-row__surface--locked]="!entry().editable"
  role="button"
  [attr.tabindex]="entry().editable ? 0 : -1"
  [attr.aria-pressed]="entry().editable ? checked() : null"
  [attr.aria-label]="(entry().editable ? 'Mark ' : '') + entry().name + (entry().editable ? ' done' : ' — locked, can no longer be changed')"
  [attr.aria-disabled]="!entry().editable || busy() ? true : null"
  (click)="onToggle(!checked())"
  (keydown.enter)="onToggle(!checked())"
  (keydown.space)="$event.preventDefault(); onToggle(!checked())"
>
  <!-- Dragging has its own handle rather than the whole row: the row's own tap toggles
       the habit, and a list you reorder by pressing the same surface that marks things
       done would cost you a wrongly-ticked habit every time a drag was misread. The
       handle is only there when the list is actually reorderable. -->
  @if (reorderable()) {
    <button
      type="button"
      class="df-habit-row__grip"
      cdkDragHandle
      [attr.aria-label]="'Reorder ' + entry().name"
      (click)="$event.stopPropagation()"
    >
      <lucide-icon [img]="gripIcon" [size]="16" aria-hidden="true" />
    </button>
  }

  <lucide-icon class="df-habit-row__icon" [img]="icon()" [size]="20" aria-hidden="true" />

  <div class="df-habit-row__body">
    <span class="df-habit-row__name">{{ entry().name }}</span>

    <div class="df-habit-row__meta">
      <span class="df-habit-row__points">{{ entry().points }} pts</span>

      @if (entry().currentStreak > 0) {
        <span class="df-habit-row__streak">
          <lucide-icon [img]="flameIcon" [size]="14" aria-hidden="true" />
          {{ entry().currentStreak }}-day streak
        </span>
      }

      @if (stateChip(); as chip) {
        <df-chip [tone]="chip.tone">{{ chip.label }}</df-chip>
      }
    </div>
  </div>

  @if (entry().editable) {
    @if (checked()) {
      <span class="df-habit-row__done-badge" aria-hidden="true">
        <svg class="df-habit-row__tick" viewBox="0 0 16 16" fill="none">
          <path
            d="M3.5 8.5 L6.5 11.5 L12.5 4.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    }
  } @else {
    <span class="df-habit-row__lock" aria-hidden="true">
      <lucide-icon [img]="lockIcon" [size]="18" aria-hidden="true" />
    </span>
  }

  <button
    dfIconButton
    type="button"
    [label]="'Edit ' + entry().name"
    variant="ghost"
    [icon]="editIcon"
    (click)="requestEdit($event)"
  ></button>
</div>
